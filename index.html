        });

        link.setAttribute("href", encodedUri);

    function MultiVerificationPanel() {
      const [verifying, setVerifying] = useState(false);
      const [verifyProgress, setVerifyProgress] = useState(100);
      
      const [status, setStatus] = useState({
        tw: { syncTime: "14:30 CST", main: "TWSE API", secondary: "TPEx Feed", dom: "VERIFIED", for: "VERIFIED", match: true },
        jp: { syncTime: "15:15 CST", main: "JPX English", secondary: "TSE Core", dom: "VERIFIED", for: "VERIFIED", match: true },
        kr: { syncTime: "15:30 CST", main: "KRX MDC", secondary: "KOSPI Clear", dom: "VERIFIED", for: "VERIFIED", match: true },
      });

      const handleReverify = () => {
        setVerifying(true);
        setVerifyProgress(0);
        
        let progress = 0;
        const interval = setInterval(() => {
          progress += 20;
          setVerifyProgress(progress);
          if (progress >= 100) {
            clearInterval(interval);
            setVerifying(false);
            setStatus({
              tw: { syncTime: "14:30 CST", main: "TWSE API", secondary: "TPEx Feed", dom: "SYNCED (12ms)", for: "SYNCED (15ms)", match: true },
              jp: { syncTime: "15:15 CST", main: "JPX English", secondary: "TSE Core", dom: "SYNCED (45ms)", for: "SYNCED (41ms)", match: true },
              kr: { syncTime: "15:30 CST", main: "KRX MDC", secondary: "KOSPI Clear", dom: "SYNCED (28ms)", for: "SYNCED (30ms)", match: true },
            });
          }
        }, 200);
      };

      const VerificationCard = ({ market, data, title }) => (
        <div className="bg-zinc-900/40 border border-zinc-800/80 p-4 rounded-md space-y-3 relative overflow-hidden group hover:border-zinc-700 transition-all">
          {verifying && (
            <div className="absolute inset-0 bg-zinc-900/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
               <RefreshCw className="w-5 h-5 text-cyan-400 animate-spin mb-2" />
               <div className="text-[10px] text-cyan-400 font-mono">CROSS-CHECKING... {verifyProgress}%</div>

    function OverviewTab({ markets, usdComparison, selectedCurrency, onSelectMarket }) {
