            </div>
            <button 
              onClick={handleReverify}
              disabled={verifying}
              className="px-3 py-1.5 text-[11px] bg-zinc-900 hover:bg-zinc-800 text-white border border-zinc-800 rounded transition-all hover:border-zinc-600 flex items-center space-x-1.5 disabled:opacity-50"
            >
              <RefreshCw className={`w-3.5 h-3.5 ${verifying ? 'animate-spin text-cyan-400' : ''}`} />
              <span>RUN INTEGRITY CHECK</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <VerificationCard market="tw" data={status.tw} title="TWSE / TPEx (台灣)" />
            <VerificationCard market="jp" data={status.jp} title="JPX Group (日本)" />
            <VerificationCard market="kr" data={status.kr} title="KRX Korea (韓國)" />
          </div>
        </div>
      );
    }

    function AnalyticsTab({ data }) {
      const [timeframe, setTimeframe] = useState('14D');

      if (!LineChart || !ResponsiveContainer) {
        return (
          <div className="flex flex-col items-center justify-center h-64 bg-zinc-950 border border-zinc-800/80 rounded-md text-zinc-500 font-mono space-y-4">
             <RefreshCw className="w-8 h-8 animate-spin text-cyan-900" />
             <div>正在載入圖表模組或載入失敗 (Chart library failed to load)</div>
          </div>
        );
      }

      const sliceCount = timeframe === '7D' ? -7 : timeframe === '14D' ? -14 : -30;
      const chartData = data.cumulativeFlow.slice(sliceCount);

      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          
          <div className="bg-zinc-950 border border-zinc-800/80 p-5 rounded-md shadow-lg">
             <div className="flex flex-wrap gap-4 items-center justify-between pb-4 border-b border-zinc-900 mb-6">
                <div className="flex items-center space-x-2 font-mono text-white">
                  <BarChart3 className="w-5 h-5 text-cyan-400" />
                  <h3 className="text-sm font-bold tracking-wider uppercase">Cumulative Capital Flow (累積籌碼趨勢)</h3>
                </div>
                
                {/* 🆕 時間區間切換按鈕 */}
                <div className="flex items-center space-x-3">
                  <span className="text-[10px] font-mono text-zinc-500 bg-zinc-900 px-2 py-1 rounded hidden sm:block">UNIT: M USD</span>
                  <div className="flex bg-zinc-900 rounded border border-zinc-700 overflow-hidden text-xs font-mono">
                    <button onClick={() => setTimeframe('7D')} className={`px-4 py-1.5 transition-colors ${timeframe === '7D' ? 'bg-zinc-700 text-white shadow-inner' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800'}`}>7D</button>
                    <button onClick={() => setTimeframe('14D')} className={`px-4 py-1.5 transition-colors border-l border-zinc-800 ${timeframe === '14D' ? 'bg-zinc-700 text-white shadow-inner' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800'}`}>14D</button>
                    <button onClick={() => setTimeframe('30D')} className={`px-4 py-1.5 transition-colors border-l border-zinc-800 ${timeframe === '30D' ? 'bg-zinc-700 text-white shadow-inner' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800'}`}>30D</button>
                  </div>
                </div>
             </div>
             
             <div className="h-80 w-full font-mono text-xs">
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={chartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#27272a" vertical={false} />
                    <XAxis dataKey="date" stroke="#71717a" tick={{fill: '#71717a'}} tickMargin={10} axisLine={false} tickLine={false} />
                    <YAxis stroke="#71717a" tick={{fill: '#71717a'}} axisLine={false} tickLine={false} tickFormatter={(val) => `${val > 0 ? '+' : ''}${val}`} />
                    <RechartsTooltip content={<CustomChartTooltip />} />
                    <Legend iconType="circle" wrapperStyle={{ paddingTop: '20px' }} />
                    <Line type="monotone" name="TWSE (台灣)" dataKey="tw_cum" stroke="#3b82f6" strokeWidth={3} dot={false} activeDot={{ r: 6, fill: '#3b82f6', stroke: '#050507', strokeWidth: 2 }} />
                    <Line type="monotone" name="JPX (日本)" dataKey="jp_cum" stroke="#ec4899" strokeWidth={3} dot={false} activeDot={{ r: 6, fill: '#ec4899', stroke: '#050507', strokeWidth: 2 }} />
                    <Line type="monotone" name="KRX (韓國)" dataKey="kr_cum" stroke="#eab308" strokeWidth={3} dot={false} activeDot={{ r: 6, fill: '#eab308', stroke: '#050507', strokeWidth: 2 }} />
                  </LineChart>
                </ResponsiveContainer>
             </div>
             <div className="mt-4 text-[11px] text-zinc-500 font-sans border-t border-zinc-900/50 pt-3 flex items-start gap-2">
                <Activity className="w-4 h-4 text-cyan-700 shrink-0 mt-0.5" />
                <p><strong>動態洞察 ({timeframe})：</strong>切換時間軸可觀察極短期反彈或中長期趨勢。目前顯示外資在 9 月初出現斷崖式同步連續撤出。韓國股市因記憶體前景疑慮，更是呈現長達一個月的資金持續外流趨勢。</p>
             </div>
          </div>

          <div className="bg-zinc-950 border border-zinc-800/80 p-5 rounded-md shadow-lg">
            <div className="flex items-center justify-between pb-4 border-b border-zinc-900 mb-6">
                <div className="flex items-center space-x-2 font-mono text-white">
                  <PieChartIcon className="w-5 h-5 text-emerald-400" />
                  <h3 className="text-sm font-bold tracking-wider uppercase">Cross-Border Sector Heatmap (跨國產業籌碼熱力圖)</h3>
                </div>
                <span className="text-[10px] font-mono text-zinc-500 bg-zinc-900 px-2 py-1 rounded">INTENSITY = ABSOLUTE FLOW VOLUME</span>
             </div>

             <SectorHeatmapGrid data={data.sectorHeatmap} />

             <div className="mt-6 text-[11px] text-zinc-500 font-sans border-t border-zinc-900/50 pt-3 flex items-start gap-2">
                <Filter className="w-4 h-4 text-cyan-700 shrink-0 mt-0.5" />
                <p><strong>熱力圖說明：</strong>區塊大小固定，背景顏色深淺代表資金淨流入/流出的絕對金額規模 (Intensity)。<span className="text-emerald-500/80 font-bold">綠色區塊</span>代表外資淨買超卡位；<span className="text-rose-500/80 font-bold">紅色區塊</span>代表遭到外資無差別提款。半導體板塊（代工、設備、記憶體）為本次跨國撤資重災區。</p>
             </div>
          </div>

        </div>
      );
    }

    const CustomChartTooltip = ({ active, payload, label }) => {
      if (active && payload && payload.length) {
        return (
          <div className="bg-zinc-900/95 border border-zinc-700 p-3 rounded shadow-xl font-mono text-xs backdrop-blur-sm">
            <div className="text-white font-bold mb-2 border-b border-zinc-700 pb-1">{label} CUMULATIVE FLOW</div>
            {payload.map((entry, index) => (
              <div key={index} className="flex justify-between items-center space-x-6 mt-1.5">
                <div className="flex items-center">
                  <span className="w-2 h-2 rounded-full mr-2" style={{ backgroundColor: entry.color }}></span>
                  <span className="text-zinc-300">{entry.name}</span>
                </div>
                <span className={`font-bold ${entry.value > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {entry.value > 0 ? '+' : ''}{entry.value} M
                </span>
              </div>
            ))}
          </div>
        );
      }
      return null;
    };

    function SectorHeatmapGrid({ data }) {
      const sortedData = [...data].sort((a, b) => Math.abs(b.flow) - Math.abs(a.flow));
      const maxAbsoluteFlow = Math.max(...sortedData.map(d => Math.abs(d.flow)));

      return (
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
          {sortedData.map((item, idx) => {
            const isPos = item.flow >= 0;
            const intensity = Math.max((Math.abs(item.flow) / maxAbsoluteFlow), 0.15); 
            
            const bgColor = isPos 
              ? `rgba(16, 185, 129, ${intensity})`
              : `rgba(244, 63, 94, ${intensity})`; 
            
            const borderColor = isPos ? 'rgba(16, 185, 129, 0.5)' : 'rgba(244, 63, 94, 0.5)';
            const textColor = isPos ? '#34d399' : '#fb7185';

            return (
              <div 
                key={idx} 
                className="flex flex-col justify-between p-3 rounded border transition-transform hover:scale-[1.02] cursor-default h-24"
                style={{ backgroundColor: bgColor, borderColor: borderColor }}
              >
                <div className="text-xs font-bold text-white drop-shadow-md flex justify-between items-start">
                  <span className="truncate pr-2">{item.sector.split(' ')[0]}</span>
                  <span className="text-[9px] text-zinc-300 font-mono bg-black/30 px-1 rounded">{item.sector.split(' ')[1]}</span>
                </div>
                <div className="font-mono text-right mt-2">
                   <div className="text-[10px] text-white/70 mb-0.5">NET FLOW</div>
                   <div className="text-lg font-black drop-shadow-lg" style={{ color: textColor }}>
                     {isPos ? '+' : ''}{item.flow} <span className="text-[10px] font-normal text-white/70">M</span>
                   </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function FooterSection() {
      return (
        <footer className="mt-12 border-t border-zinc-800/80 bg-[#08080c] py-10 font-mono text-xs text-zinc-400">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
              
              <div className="bg-zinc-950/70 border border-zinc-800/70 p-4 rounded space-y-2.5 group hover:border-zinc-700 transition-colors">
                <div className="flex items-center space-x-2 text-white group-hover:text-cyan-400 transition-colors text-xs font-bold tracking-wider">
                  <Database className="w-4 h-4" />
                  <span>DATA SOURCES 資訊源</span>
                </div>
                <ul className="space-y-1.5 text-zinc-400 text-[11px] font-sans">
                  <li className="flex items-center justify-between"><span>台灣 (TWSE / TPEx)</span><span className="text-zinc-500 text-[10px] font-mono">官方 API + 券商 Feed</span></li>
                  <li className="flex items-center justify-between"><span>日本 (JPX / TSE)</span><span className="text-zinc-500 text-[10px] font-mono">投資部門別 + 核心數據</span></li>
                  <li className="flex items-center justify-between"><span>韓國 (KRX)</span><span className="text-zinc-500 text-[10px] font-mono">KOSPI 彙整 + 結算 API</span></li>
                </ul>
              </div>

              <div className="bg-zinc-950/70 border border-zinc-800/70 p-4 rounded space-y-2.5 group hover:border-zinc-700 transition-colors">
                <div className="flex items-center space-x-2 text-white group-hover:text-cyan-400 transition-colors text-xs font-bold tracking-wider">
                  <Clock className="w-4 h-4" />
                  <span>SYNC SCHEDULE 更新頻率</span>
                </div>
                <div className="text-[11px] font-sans text-zinc-400 space-y-1.5 leading-relaxed">
                  <p>• <strong>台股 TWSE：</strong>每日 15:30 CST 盤後同步</p>
                  <p>• <strong>日股 JPX：</strong>每日 16:30 CST 統計彙整</p>
                  <p>• <strong>韓股 KRX：</strong>每日 16:00 CST 結算揭露</p>
                </div>
              </div>

              <div className="bg-zinc-950/70 border border-zinc-800/70 p-4 rounded space-y-2.5 group hover:border-zinc-700 transition-colors">
                <div className="flex items-center space-x-2 text-white group-hover:text-cyan-400 transition-colors text-xs font-bold tracking-wider">
                  <BarChart3 className="w-4 h-4" />
                  <span>FX CONVERSION 匯率換算</span>
                </div>
                <div className="text-[11px] font-sans text-zinc-400 space-y-1.5 leading-relaxed">
                  <p>所有 USD 計價欄位皆採用當日台北/東京/首爾外匯市場中價進行標準化統一折算，單位為百萬美元 (M USD)。</p>
                </div>
              </div>

              <div className="bg-zinc-950/70 border border-zinc-800/70 p-4 rounded space-y-2.5 group hover:border-zinc-700 transition-colors">
                <div className="flex items-center space-x-2 text-white group-hover:text-cyan-400 transition-colors text-xs font-bold tracking-wider">
                  <ShieldCheck className="w-4 h-4" />
                  <span>DISCLAIMER 免責聲明</span>
                </div>
                <div className="text-[11px] font-sans text-zinc-500 leading-relaxed">
                  本系統數據僅供市場研析與學術觀測，非作為任何投資買賣之推薦或保證，投資人應獨立判斷並自負風險。
                </div>
              </div>

            </div>

            <div className="pt-6 border-t border-zinc-900/80 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-zinc-500">
              <div className="flex items-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_#10b981]"></span>
                <span>SYSTEM STATUS: OPERATIONAL</span>
                <span className="text-zinc-700">|</span>
                <span>EAST ASIA CAPITAL FLOW TERMINAL PRO</span>
              </div>
              <div>
                <span>DATA PIPELINE MULTI-CONFIRMED (2026)</span>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
